# Render Blueprint — backend web service + managed Postgres.
# This file sits at the ROOT of the backend repo.
# Deploy: push the backend repo to GitHub, then in Render: New → Blueprint → pick it.
services:
  - type: web
    name: restaurant-pos-api
    runtime: node
    plan: free
    # Generate the Prisma client, then apply committed migrations to the DB.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-pos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random secret
      - key: NODE_VERSION
        value: "20"
      # Set these two yourself in the Render dashboard:
      - key: FRONTEND_URL # your Vercel URL, e.g. https://pos-frontend.vercel.app
        sync: false
      - key: STRIPE_SECRET_KEY # sk_test_... (optional; payments work without it)
        sync: false

databases:
  - name: restaurant-pos-db
    plan: free
